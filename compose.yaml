# ZimaOS-first deployment. Replace the setup-secret placeholder before first start.
services:
  ryoiku:
    image: ghcr.io/maroishiku/ryoiku:latest
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    security_opt: [no-new-privileges:true]
    ports:
      - target: 8080
        published: "65006"
        protocol: tcp
    environment:
      ISHIKU_SETUP_SECRET: "REPLACE-WITH-A-UNIQUE-SECRET-OF-AT-LEAST-32-CHARACTERS"
      COOKIE_SECURE: "false"
      TZ: Europe/Berlin
    volumes:
      - type: bind
        source: /DATA/AppData/i_ryoiku/Data
        target: /data
    tmpfs: ["/tmp:size=64m,mode=1777"]
    healthcheck:
      test: [CMD, /usr/local/bin/node, -e, "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    x-casaos:
      envs:
        - container: ISHIKU_SETUP_SECRET
          description: { en_us: Unique first-run setup secret with at least 32 characters }
      ports:
        - container: "8080"
          description: { en_us: Web interface }
      volumes:
        - container: /data
          description: { en_us: Persistent application data }

x-casaos:
  id: dev.ishiku.ryoiku
  architectures: [amd64]
  main: ryoiku
  author: ishiku
  category: Lifestyle
  developer: ishiku
  title: { en_us: Ryoiku }
  tagline: { en_us: Your private travel history and world map }
  description: { en_us: "A private self-hosted map for visits, cities, trips, wishes, statistics, imports, and backups." }
  icon: https://cdn.jsdelivr.net/gh/MaroIshiku/ryoiku@latest/src/client/public/ryoiku-icon.png
  index: /
  port_map: "65006"
  repo: https://github.com/MaroIshiku/ryoiku
