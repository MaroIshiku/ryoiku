name: Ryoiku promote release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ryoiku-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Wait for the verified immutable image
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ishiku-release-release.yml/runs?event=push&head_sha=${GITHUB_SHA}&per_page=10")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"${result}")"
            if [[ -z "${run_id}" ]]; then sleep 10; continue; fi
            status="$(jq -r '.workflow_runs[0].status' <<<"${result}")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"${result}")"
            url="$(jq -r '.workflow_runs[0].html_url' <<<"${result}")"
            if [[ "${status}" == "completed" ]]; then
              [[ "${conclusion}" == "success" ]] || { echo "Immutable release failed: ${url}" >&2; exit 1; }
              echo "release-url=${url}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the immutable release workflow." >&2
          exit 1
      - name: Check out release sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="${image}:${GITHUB_REF_NAME}"
          digest="$(docker buildx imagetools inspect "${source}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No immutable digest for ${source}." >&2; exit 1; }
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "source=${source}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${source}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Scan high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: sarif
          output: ryoiku-vulnerability-report.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output: ryoiku-sbom.spdx.json
          exit-code: '0'
      - name: Store release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ryoiku-release-evidence-${{ github.run_id }}
          path: |
            ryoiku-sbom.spdx.json
            ryoiku-vulnerability-report.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Promote verified stable digest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: docker buildx imagetools create --tag "${{ steps.image.outputs.image }}:latest" "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"
      - name: Publish GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.image.outputs.source }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_RUN_URL: ${{ steps.wait.outputs.release-url }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          changelog="$(awk -v heading="## ${version} " 'index($0, heading) == 1 { capture=1; next } capture && /^## / { exit } capture { print }' CHANGELOG.md)"
          [[ -n "${changelog}" ]] || { echo "Missing changelog section for ${version}." >&2; exit 1; }
          cat > release-notes.md <<EOF
          ## Ryoiku ${version}

          ${changelog}

          ### Deployment

          - Image: \`${SOURCE}@${DIGEST}\`
          - ZimaOS port: \`8515\`
          - Persistent data: \`/DATA/AppData/i_ryoiku/Data\`
          - Immutable verification: ${RELEASE_RUN_URL}

          Back up the complete data directory before updating. Replace the setup-secret placeholder before the first start.
          EOF
          gh release create "${GITHUB_REF_NAME}" ryoiku-sbom.spdx.json ryoiku-vulnerability-report.sarif --verify-tag --target "${GITHUB_SHA}" --title "Ryoiku ${version}" --notes-file release-notes.md
