{
  "schema_version": 1,
  "application": { "id": "ryoiku", "name": "Ryoiku", "family": "ishiku", "locale": "en" },
  "summary": "A private, self-hosted travel history and world-map application for countries, cities, visits, trips, wishes, statistics, and portable backups.",
  "requirements": [
    { "id": "PLAT-001", "title": "Operational health and durable storage", "priority": "critical", "acceptance": ["Liveness and readiness endpoints distinguish process health from SQLite dependency health.", "Versioned, restart-safe migrations initialize and preserve the SQLite database."], "security_critical": false },
    { "id": "AUTH-001", "title": "Protected local administrator account", "priority": "critical", "acceptance": ["First-run setup creates one local administrator and closes permanently after successful creation.", "Production setup can require a unique one-time deployment secret of at least 32 characters.", "Passwords use Argon2id and authenticated server-side sessions have idle and absolute expiry, revocation, secure cookies, and CSRF protection.", "Invalid credentials use a generic response and authentication and setup attempts are rate limited."], "security_critical": true },
    { "id": "DATA-001", "title": "Canonical travel history", "priority": "critical", "acceptance": ["Users can create, inspect, update, and delete repeat visits with country, optional city, optional trip, date precision, and notes.", "Country and city visited states are derived only from visits and never stored as mutable flags.", "Deleting a trip keeps its visits and deleting a city requires an explicit policy for linked visits."], "security_critical": false },
    { "id": "DATA-002", "title": "Cities trips and wishlist", "priority": "high", "acceptance": ["Users can manage custom cities, trips, and country or city wishlist entries.", "Potential duplicate cities are reported and can be merged explicitly while linked visits and wishlist entries are preserved.", "Country, city, trip, and visit detail APIs enforce ownership and foreign-key consistency."], "security_critical": true },
    { "id": "GEO-001", "title": "Private offline place discovery", "priority": "high", "acceptance": ["Authenticated users can search a bundled, versioned place index by name or alternate name and receive a bounded list with city, region, country, and coordinates without outbound requests.", "Selecting a search result while adding a visit derives the country and atomically reuses or creates the city and visit without requiring a separate city workflow.", "Saved cities, manual city creation, and country-only visits remain available, and dataset attribution is visible and documented."], "security_critical": true },
    { "id": "MAPS-001", "title": "Private interactive world map", "priority": "high", "acceptance": ["An Equal Earth world map renders exclusively from bundled topology without third-party map requests.", "Visited countries, wishlist countries, map layers, accessible country synchronization, pan, zoom, and optional city markers are available."], "security_critical": false },
    { "id": "STAT-001", "title": "Travel insights", "priority": "high", "acceptance": ["The application calculates country, city, visit, wishlist, continent, timeline, and ranking summaries from canonical records.", "Country totals support UN 195, ISO 3166, and user-defined counting modes."], "security_critical": false },
    { "id": "PORT-001", "title": "Previewed portable import and export", "priority": "critical", "acceptance": ["CSV import detects supported delimiters, validates every row, previews warnings and errors, and commits atomically only when valid.", "CSV exports use a documented canonical schema and mitigate spreadsheet formula execution.", "JSON backups exclude credentials and sessions and restore through previewed merge or travel-data replacement transactions."], "security_critical": true },
    { "id": "UIUX-001", "title": "Responsive accessible ishiku interface", "priority": "high", "acceptance": ["All user-facing text is English and the interface implements the current ishiku design contract with six themes and light, dark, and system modes.", "Desktop rail and mobile bottom navigation remain usable at supported breakpoints with keyboard, reduced-motion, forced-colors, and WCAG 2.2 AA considerations.", "Loading, empty, validation, error, confirmation, and success states are explicit."], "security_critical": false },
    { "id": "SECU-001", "title": "Private-by-default operation", "priority": "critical", "acceptance": ["Runtime operation has no telemetry and no required outbound network requests.", "Security headers, request size limits, ownership checks, redacted structured logs, strict input validation, and safe output handling protect private travel data.", "Secrets, credentials, sessions, databases, backups, and user content are excluded from source and container build contexts."], "security_critical": true },
    { "id": "OPER-001", "title": "Hardened self-hosted delivery", "priority": "critical", "acceptance": ["The OCI image runs as a fixed non-root user with only the data directory writable.", "ZimaOS-first Compose defines persistent data, health checks, resource bounds, dropped capabilities, bounded logs, and an explicit setup secret.", "Upgrade, backup, restore, rollback, and reverse-proxy requirements are documented."], "security_critical": true },
    { "id": "META-001", "title": "Release identity and notices", "priority": "high", "acceptance": ["About data exposes application version, build date, Git SHA, dataset versions, and license.", "The repository contains license, notice, third-party attribution, changelog, architecture, security, and operating documentation."], "security_critical": false },
    { "id": "TEST-001", "title": "Risk-based release evidence", "priority": "critical", "acceptance": ["Unit and API tests cover authentication, authorization, CSRF, derived state, referential behavior, atomic import, safe export, backup restore, and session revocation.", "Chromium, Firefox, and WebKit browser tests cover first run, core travel entry, accessibility, responsive overflow, and the complete theme and mode matrix.", "CI runs application, Compose, container, vulnerability, SBOM, provenance, and immutable release gates."], "security_critical": true }
  ]
}
